<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fun Uncle — UFC 5 Style Mechanics Prototype</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- CLEAN UFC 5 TOP BAR -->
  <header id="ufc-header">
    <div class="fighter-hud left">
      <div class="fighter-meta">
        <span class="fighter-name left-name">RAY (UNCLE)</span>
      </div>
      <div class="gauge-track">
        <div id="uncle-hp-bar" class="hp-fill cyan" style="width: 100%;"></div>
      </div>
    </div>

    <div class="clock-center">R1 • 5:00</div>

    <div class="fighter-hud right">
      <div class="fighter-meta">
        <span class="fighter-name right-name">NED (NEIGHBOR)</span>
      </div>
      <div class="gauge-track">
        <div id="neighbor-hp-bar" class="hp-fill pink" style="width: 100%;"></div>
      </div>
    </div>
  </header>

  <!-- BOTTOM CORNER MINIMAL CONTROLS HINT -->
  <div id="corner-hints">
    <button class="hint-pill" onclick="toggleControlsModal()"><kbd>H</kbd> Controls</button>
    <button id="cam-toggle-btn" class="hint-pill" onclick="toggleCamMode()"><kbd>V</kbd> Cam: Broadcast</button>
  </div>

  <!-- CONTROLS CHEAT SHEET (HIDDEN BY DEFAULT) -->
  <div id="controls-modal">
    <div class="modal-title">
      <span>Fight Controls</span>
      <button class="close-btn" onclick="toggleControlsModal()">&times;</button>
    </div>
    <div class="controls-grid">
      <div class="ctrl-item"><span class="ctrl-desc">Move</span><span class="ctrl-key">WASD / Stick</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Lead Jab</span><span class="ctrl-key">L-Click / A</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Power Cross</span><span class="ctrl-key">R-Click / X</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Lead Hook</span><span class="ctrl-key">Q / Flick L</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Roundhouse Kick</span><span class="ctrl-key">C / B</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Clinch Knee</span><span class="ctrl-key">E / RB</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Takedown Slam</span><span class="ctrl-key">R / RS Down</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Madden Stiff-Arm</span><span class="ctrl-key">F / RS Up</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Toggle Cam</span><span class="ctrl-key">V</span></div>
      <div class="ctrl-item"><span class="ctrl-desc">Close Cheat Sheet</span><span class="ctrl-key">H / ESC</span></div>
    </div>
  </div>

  <!-- KNOCKOUT BANNER -->
  <div id="ko-overlay">
    <div class="ko-box">
      <h1 id="ko-title">KNOCKOUT!</h1>
      <p id="ko-subtitle">RAY WINS BY KO</p>
      <button class="rematch-btn" onclick="resetMatch()">REMATCH</button>
    </div>
  </div>

  <!-- Main Game Loop -->
  <script type="module" src="js/main.js"></script>

  <script>
    function toggleControlsModal() {
      const modal = document.getElementById('controls-modal');
      modal.classList.toggle('visible');
    }
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyH') toggleControlsModal();
      if (e.code === 'Escape') {
        const modal = document.getElementById('controls-modal');
        if (modal) modal.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
